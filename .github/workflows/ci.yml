name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on purpose. `FixesAreDocumentedTest` walks `git log`, and
          # a depth-1 clone breaks it twice over: `git log main` fails outright
          # on a detached HEAD, and `git show --name-only` diffs against the
          # EMPTY tree, so it lists all 419 files and reports every commit as
          # having touched src/. A shallow checkout does not merely weaken the
          # guard, it inverts it.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint every source file
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Unit tests
        run: ./vendor/bin/phpunit --testsuite unit

      - name: Integration tests
        run: ./vendor/bin/phpunit --testsuite integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on purpose. `FixesAreDocumentedTest` walks `git log`, and
          # a depth-1 clone breaks it twice over: `git log main` fails outright
          # on a detached HEAD, and `git show --name-only` diffs against the
          # EMPTY tree, so it lists all 419 files and reports every commit as
          # having touched src/. A shallow checkout does not merely weaken the
          # guard, it inverts it.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: xdebug
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit tests with coverage
        # `--coverage-clover` is what PRODUCES the artifact this job uploads.
        # Without it the run only printed a text summary, clover.xml was never
        # written, and the upload silently carried nothing — a job that looks
        # like it reports coverage and reports none.
        # BOTH suites. The integration tests exercise the HTTP and SSE seams —
        # the request body that leaves and the bytes that come back — which is
        # exactly where this port's release-blocking defects lived, and none of
        # it is reachable from `tests/Unit`. Measuring only the unit suite
        # reported a coverage figure that excluded the code most likely to break.
        #
        # ONE `--testsuite` with a COMMA-separated list. Passing the flag twice
        # does not union the suites — the second value replaces the first, so a
        # first attempt wrote `--testsuite unit --testsuite integration` and CI
        # ran the integration suite ALONE (10 tests, 41 assertions), silently
        # dropping 2200 unit tests from the coverage figure. Caught by watching
        # the job fail with a suspiciously small test count, not by the guard
        # below, which asserted on the STRING and was satisfied by a command that
        # did not do what it said.
        run: >-
          ./vendor/bin/phpunit --testsuite unit,integration
          --coverage-text --coverage-clover clover.xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: clover.xml
          if-no-files-found: error
