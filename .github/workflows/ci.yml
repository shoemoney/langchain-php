name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on purpose. `FixesAreDocumentedTest` walks `git log`, and
          # a depth-1 clone breaks it twice over: `git log main` fails outright
          # on a detached HEAD, and `git show --name-only` diffs against the
          # EMPTY tree, so it lists all 419 files and reports every commit as
          # having touched src/. A shallow checkout does not merely weaken the
          # guard, it inverts it.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint every source file
        run: |
          find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Unit tests
        run: ./vendor/bin/phpunit --testsuite unit

      - name: Integration tests
        run: ./vendor/bin/phpunit --testsuite integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on purpose. `FixesAreDocumentedTest` walks `git log`, and
          # a depth-1 clone breaks it twice over: `git log main` fails outright
          # on a detached HEAD, and `git show --name-only` diffs against the
          # EMPTY tree, so it lists all 419 files and reports every commit as
          # having touched src/. A shallow checkout does not merely weaken the
          # guard, it inverts it.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json
          coverage: xdebug
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Unit tests with coverage
        # `--coverage-clover` is what PRODUCES the artifact this job uploads.
        # Without it the run only printed a text summary, clover.xml was never
        # written, and the upload silently carried nothing — a job that looks
        # like it reports coverage and reports none.
        run: ./vendor/bin/phpunit --testsuite unit --coverage-text --coverage-clover clover.xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: clover.xml
          if-no-files-found: error
